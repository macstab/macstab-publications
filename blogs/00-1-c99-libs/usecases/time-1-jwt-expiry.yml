# time · use-case 1 — CLOCK_REALTIME jumps +1h → a token minted 5 min ago reads as EXPIRED.
# Full L10 write-up: usecases/README.md §time-1.
#   run:  docker compose -f usecases/time-1-jwt-expiry.yml up --abort-on-container-exit
#   watch for: "TOKEN EXPIRED — clock skew made a fresh token look stale"
name: chaos-time-1
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-time-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-time-glibc-$$ARCH.so: OK"
        cp "libchaos-time-glibc-$$ARCH.so" libchaos-time.so

  app:
    image: python:3.12-slim-bookworm
    depends_on:
      fetch: { condition: service_completed_successfully }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'clock_gettime/realtime:OFFSET:3600000\n' > /tmp/.chaos-time.conf   # +3,600,000 ms = +1h
        cat > /mint.py <<'PY'
        import hmac,hashlib,base64,json,time
        b=lambda x: base64.urlsafe_b64encode(x).rstrip(b'=')
        h=b(json.dumps({"alg":"HS256","typ":"JWT"}).encode())
        p=b(json.dumps({"sub":"svc","exp":int(time.time())+300}).encode())   # valid 5 minutes
        s=b(hmac.new(b"chaos",h+b"."+p,hashlib.sha256).digest())
        print((h+b"."+p+b"."+s).decode())
        PY
        cat > /verify.py <<'PY'
        import sys,base64,json,time
        d=lambda s: base64.urlsafe_b64decode(s+"="*(-len(s)%4))
        _,p,_=sys.stdin.read().strip().split(".")
        exp=json.loads(d(p))["exp"]; now=int(time.time())
        print(f"exp={exp}  now(seen by process)={now}  delta={exp-now}s")
        print("VALID" if now<exp else "TOKEN EXPIRED — clock skew made a fresh token look stale")
        PY
        python3 /mint.py > /tmp/token                                   # real clock → genuine 5-min token
        exec env LD_PRELOAD=/libs/libchaos-time.so python3 /verify.py < /tmp/token   # offset clock → expired

volumes:
  chaoslibs: {}
