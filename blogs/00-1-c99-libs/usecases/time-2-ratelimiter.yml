# time · use-case 2 — CLOCK_MONOTONIC jumps BACKWARD → elapsed-time math goes negative.
# Full L10 write-up: usecases/README.md §time-2.
#   run:  docker compose -f usecases/time-2-ratelimiter.yml up --abort-on-container-exit
#   watch for: "BROKEN: monotonic went BACKWARD — elapsed = -5.000s"
name: chaos-time-2
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-time-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-time-glibc-$$ARCH.so: OK"
        cp "libchaos-time-glibc-$$ARCH.so" libchaos-time.so

  app:
    image: python:3.12-slim-bookworm
    depends_on:
      fetch: { condition: service_completed_successfully }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'clock_gettime/monotonic:OFFSET:0\n' > /tmp/.chaos-time.conf     # start unshifted
        cat > /limiter.py <<'PY'
        import time
        t0 = time.monotonic()
        open("/tmp/.chaos-time.conf","w").write("clock_gettime/monotonic:OFFSET:-5000\n")  # jump back 5s
        t1 = time.monotonic()
        dt = t1 - t0
        print(f"t0={t0:.3f}  t1={t1:.3f}  elapsed={dt:.3f}s")
        if dt < 0:
            print(f"BROKEN: monotonic went BACKWARD — elapsed = {dt:.3f}s")
            print("every timeout, backoff and rate-limiter computed from this delta is now wrong")
        else:
            print("elapsed non-negative (increase the jump if your host coalesced the reads)")
        PY
        exec env LD_PRELOAD=/libs/libchaos-time.so python3 /limiter.py

volumes:
  chaoslibs: {}
