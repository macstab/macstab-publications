# memory · use-case 2 — inject 150 ms of latency into mmap() → allocation-path tail latency.
# Full L10 write-up: usecases/README.md §mem-2.
#   run:  docker compose -f usecases/mem-2-latency.yml up --abort-on-container-exit
#   watch for: "mmap took ~150 ms"
name: chaos-mem-2
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-memory-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-memory-glibc-$$ARCH.so: OK"
        cp "libchaos-memory-glibc-$$ARCH.so" libchaos-memory.so

  app:
    image: gcc:bookworm
    depends_on:
      fetch: { condition: service_completed_successfully }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'mmap:LATENCY:150\n' > /tmp/.chaos-memory.conf
        cat > /p.c <<'C'
        #include <stdio.h>
        #include <time.h>
        #include <sys/mman.h>
        static double ms(void){ struct timespec t; clock_gettime(CLOCK_MONOTONIC,&t); return t.tv_sec*1e3 + t.tv_nsec/1e6; }
        int main(void){
          double a = ms();
          void *p = mmap(NULL, 1<<20, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0);
          double b = ms();
          printf("mmap took %.1f ms (%s)\n", b-a, p==MAP_FAILED ? "FAILED" : "ok");
          return 0;
        }
        C
        gcc -O2 -o /p /p.c
        exec env LD_PRELOAD=/libs/libchaos-memory.so /p

volumes:
  chaoslibs: {}
