# dns · use-case 2 — intermittent getaddrinfo() EAI_AGAIN → does your client retry with backoff?
# Full L10 write-up: usecases/README.md §dns-2.
#   run:  docker compose -f usecases/dns-2-eai-again.yml up --abort-on-container-exit
#   watch for: a mix of "resolve FAILED (EAI_AGAIN)" and "resolved -> ..."
name: chaos-dns-2
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-dns-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-dns-glibc-$$ARCH.so: OK"
        cp "libchaos-dns-glibc-$$ARCH.so" libchaos-dns.so

  backend:
    image: nginx:bookworm

  client:
    image: python:3.12-slim-bookworm
    depends_on:
      fetch:   { condition: service_completed_successfully }
      backend: { condition: service_started }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'dns://backend:EAI_AGAIN:0.5\n' > /tmp/.chaos-dns.conf
        cat > /app.py <<'PY'
        import socket
        ok = fail = 0
        for i in range(12):
            try:
                addr = socket.getaddrinfo("backend", 80, proto=socket.IPPROTO_TCP)[0][4][0]
                ok += 1;  print(f"attempt {i:2d}: resolved -> {addr}")
            except socket.gaierror as e:
                fail += 1; print(f"attempt {i:2d}: resolve FAILED ({e})")
        print(f"summary: {ok} ok / {fail} EAI_AGAIN — retry-with-backoff is what saves you")
        PY
        exec env LD_PRELOAD=/libs/libchaos-dns.so python3 /app.py

volumes:
  chaoslibs: {}
