# net · use-case 2 — HTTP client recv() times out mid-response from a healthy nginx.
# Full L10 write-up: usecases/README.md §net-2.
#   run:  docker compose -f usecases/net-2-http-timeout.yml up --abort-on-container-exit
#   watch for: "recv -> [Errno 110] Connection timed out"
name: chaos-net-2
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-net-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-net-glibc-$$ARCH.so: OK"
        cp "libchaos-net-glibc-$$ARCH.so" libchaos-net.so

  nginx:
    image: nginx:bookworm

  client:
    image: python:3.12-slim-bookworm
    depends_on:
      fetch: { condition: service_completed_successfully }
      nginx: { condition: service_started }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'tcp4://*:80:recv:ETIMEDOUT:1.0\n' > /tmp/.chaos-net.conf
        cat > /app.py <<'PY'
        import socket
        s = socket.create_connection(("nginx", 80), timeout=5)
        s.sendall(b"GET / HTTP/1.0\r\nHost: nginx\r\n\r\n")
        try:
            data = s.recv(4096); print(f"got {len(data)} bytes")
        except OSError as e:
            print(f"recv -> [Errno {e.errno}] {e.strerror}")
        PY
        exec env LD_PRELOAD=/libs/libchaos-net.so python3 /app.py

volumes:
  chaoslibs: {}
