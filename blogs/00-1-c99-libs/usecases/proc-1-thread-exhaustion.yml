# process · use-case 1 — pthread_create() succeeds 8×, then EAGAIN forever (stateful FAIL_AFTER).
# Full L10 write-up: usecases/README.md §proc-1.
#   run:  docker compose -f usecases/proc-1-thread-exhaustion.yml up --abort-on-container-exit
#   watch for: "thread 9: pthread_create FAILED (Resource temporarily unavailable)"
name: chaos-proc-1
services:
  fetch:
    image: alpine:3.20
    environment:
      CHAOS_VERSION: ${CHAOS_VERSION:-1.0.0}
    volumes: [ "chaoslibs:/libs" ]
    command:
      - sh
      - -ec
      - |
        apk add --no-cache wget ca-certificates >/dev/null
        ARCH=$$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        B="https://github.com/macstab/macstab-chaos-testing-libraries/releases/download/$$CHAOS_VERSION"
        cd /libs
        wget -q "$$B/libchaos-process-glibc-$$ARCH.so" "$$B/SHA256SUMS"
        sha256sum -c SHA256SUMS --ignore-missing 2>&1 | grep "libchaos-process-glibc-$$ARCH.so: OK"
        cp "libchaos-process-glibc-$$ARCH.so" libchaos-process.so

  app:
    image: gcc:bookworm
    depends_on:
      fetch: { condition: service_completed_successfully }
    volumes: [ "chaoslibs:/libs:ro" ]
    command:
      - bash
      - -c
      - |
        printf 'pthread_create:FAIL_AFTER:EAGAIN,8\n' > /tmp/.chaos-process.conf
        cat > /p.c <<'C'
        #include <stdio.h>
        #include <string.h>
        #include <pthread.h>
        static void *noop(void *_){ (void)_; return NULL; }
        int main(void){
          for (int i = 1; i <= 16; i++){
            pthread_t t;
            int r = pthread_create(&t, NULL, noop, NULL);   /* returns errno directly */
            if (r){ printf("thread %2d: pthread_create FAILED (%s)\n", i, strerror(r)); break; }
            printf("thread %2d: ok\n", i);
            pthread_join(t, NULL);
          }
          return 0;
        }
        C
        gcc -O2 -pthread -o /p /p.c
        exec env LD_PRELOAD=/libs/libchaos-process.so /p

volumes:
  chaoslibs: {}
